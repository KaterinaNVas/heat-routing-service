version: "2.4"
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: heat-routing-db
    environment:
      POSTGRES_DB: heat_routing
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat
    ports:
      - "5432:5432"
    volumes:
      - heat-routing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heat_routing"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heat-routing-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/heat_routing
      SPRING_DATASOURCE_USERNAME: heat
      SPRING_DATASOURCE_PASSWORD: heat
    ports:
      - "8080:8080"
volumes:
  heat-routing-db-data:
