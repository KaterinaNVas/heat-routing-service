server:
  port: 8080

spring:
  application:
    name: heat-routing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/heat_routing}
    username: ${SPRING_DATASOURCE_USERNAME:heat}
    password: ${SPRING_DATASOURCE_PASSWORD:heat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 3GB
      max-request-size: 3GB
      file-size-threshold: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

routing:
  source-crs: EPSG:4326
  metric-crs: EPSG:32637
  grid-cell-size-meters: 3.0
  scoring:
    length-weight: 0.3
    cost-weight: 0.7
    length-base-meters: 100.0
    cost-base-rubles: 25000000.0
